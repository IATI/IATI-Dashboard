  /api/limited-ckan-compatible/package_search:
    get:
      operationId: limited_ckan_compatible_package_search_list
      description: |-
        Only a minimal part of this endpoint has been implemented.
        We support pagination, and a limited set of queries to the q and fq arguments.
        Only these field names are supported: organization, owner_org, publisher_iati_id, extras_filetype
        And, they can be combined with " AND "
      parameters:
      - in: query
        name: fq
        schema:
          type: string
      - name: rows
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: start
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - limited-ckan-compatible
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCBCDatasetList'
          description: ''
    post:
      operationId: limited_ckan_compatible_package_search_create
      description: |-
        Only a minimal part of this endpoint has been implemented.
        We support pagination, and a limited set of queries to the q and fq arguments.
