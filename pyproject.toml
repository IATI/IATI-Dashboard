[tool.isort]
py_version=312
extend_skip = ["__pycache__", ".mypy_cache", ".ve", ".venv", ".vagrant-ve"]
skip_gitignore = true
src_paths = ["dashboard", "end_to_end_tests"]
line_length = 119
profile = "black"


[tool.flake8]
max-line-length = 119
extend_ignore = ["E203", "W503", "E275", "E501", "E721"]
exclude = ["data", "gitout", "helpers/IATI-Rulesets", "helpers/schemas", "__pycache__", ".mypy_cache", ".pytest_cache", ".ve", ".venv", ".vagrant-ve"]


[tool.black]
line-length = 119
target-version = ["py312"]
include = "^[^/]*\\.py|dashboard/.*\\.py|end_to_end_tests/.*\\.py$"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iati_dashboard.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = ["*__pycache__*", "*.pytest_cache*"]
console_output_style = "count"
